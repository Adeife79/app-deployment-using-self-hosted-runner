apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: demo-app
  template:
    metadata:
      labels:
        app: demo-app
    spec: 
      containers:
        - name: demo-app
          image: <account_id>.dkr.ecr.<aws_region>.amazonaws.com/demo-app:v1
          ports:
            - containerPort: 5050