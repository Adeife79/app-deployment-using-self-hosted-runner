<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Self-hosted Runner Demo</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f4f7fb;
            color: #333;
        }

        .container {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .card {
            background: white;
            max-width: 600px;
            width: 100%;
            padding: 40px;
            text-align: center;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-bottom: 20px;
            color: #222;
        }

        p {
            line-height: 1.6;
            margin-bottom: 25px;
            color: #666;
        }

        .status {
            display: inline-block;
            padding: 10px 18px;
            background: #e8f5e9;
            border-radius: 20px;
            color: #2e7d32;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <div class="container">
        <div class="card">
            <h1>Hello from Kubernetes! 🚀</h1>

            <p>
                This application was built with Docker,
                pushed to Amazon ECR, and deployed on AKS using a Self Hosted Runner.
            </p>

            <div class="status">
                Application is running
            </div>
        </div>
    </div>

</body>
</html>
